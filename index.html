<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shubh Nidhi Canteen Services</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    background:url("background.jpg") no-repeat center center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    font-family:'Poppins', sans-serif;
}

/* Dark overlay like image */
body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.45);
    top:0;
    left:0;
}

/* Main Content */
.hero{
    position:relative;
    color:#f5e6c8;
    z-index:2;
    padding:20px;
}

.hero h1{
    font-family:'Playfair Display', serif;
    font-size:48px;
    letter-spacing:1px;
    margin-bottom:10px;
}

.hero p{
    font-size:20px;
    margin-bottom:30px;
    color:#e6d3a3;
}

/* Green Button Same Style */
.btn{
    padding:14px 40px;
    border-radius:30px;
    border:none;
    font-size:18px;
    cursor:pointer;
    background:linear-gradient(to bottom,#6dbb3c,#3c8d0d);
    color:white;
    box-shadow:0 4px 15px rgba(0,0,0,0.4);
    transition:0.3s ease;
}

.btn:hover{
    transform:scale(1.05);
    background:linear-gradient(to bottom,#7fd84b,#2f7a0b);
}

/* Footer text bottom like image */
.footer{
    position:absolute;
    bottom:15px;
    width:100%;
    text-align:center;
    color:#d6c7a1;
    font-size:14px;
    z-index:2;
}

/* Responsive */
@media(max-width:768px){

    .hero h1{
        font-size:32px;
    }

    .hero p{
        font-size:16px;
    }

    .btn{
        font-size:16px;
        padding:12px 30px;
    }
}
body {
    margin: 0;
    padding: 0;
    background-image: url('Background.jpg');  
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    height: 100vh;
}
</style>
</head>

<body>

<div class="hero">
    <h1>🍽️ Shubh Nidhi Canteen Services</h1>
    <p>Fresh • Pure Veg • Delicious Taste</p>
    <button class="btn">View Menu</button>
</div>

<div class="footer">
    © 2026 Shubh Nidhi Canteen Services | Pure Vegetarian Food
</div>
  

</script>
</body>
</html>
