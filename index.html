<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rahul Canteen 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at top,#111,#000);
    font-family:Arial, sans-serif;
    overflow:hidden;
    color:white;
}

.scene{
    width:260px;
    height:260px;
    perspective:900px;
}

.cube{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    animation:spin 18s infinite linear;
}

.face{
    position:absolute;
    width:260px;
    height:260px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    backdrop-filter:blur(10px);
    box-shadow:0 0 25px rgba(255,102,0,0.5);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:15px;
}

.face h2{
    color:#ff6600;
    margin-bottom:10px;
}

/* Cube Faces */
.front{transform:translateZ(130px);}
.back{transform:rotateY(180deg) translateZ(130px);}
.right{transform:rotateY(90deg) translateZ(130px);}
.left{transform:rotateY(-90deg) translateZ(130px);}
.top{transform:rotateX(90deg) translateZ(130px);}
.bottom{transform:rotateX(-90deg) translateZ(130px);}

@keyframes spin{
    0%{transform:rotateX(0) rotateY(0);}
    100%{transform:rotateX(360deg) rotateY(360deg);}
}

/* Floating glow text */
.glow{
    font-size:22px;
    animation:glow 2s infinite alternate;
}
@keyframes glow{
    from{text-shadow:0 0 10px #ff6600;}
    to{text-shadow:0 0 25px #ff6600;}
}

/* Pause animation on touch */
.scene:active .cube{
    animation-play-state:paused;
}
</style>
</head>

<body>

<div class="scene">
    <div class="cube">

        <div class="face front">
            <h2 class="glow">Rahul Canteen</h2>
            <p>Future of Industrial Food</p>
        </div>

        <div class="face back">
            <h2>About Us</h2>
            <p>Fresh, hygienic meals for factories & offices.</p>
        </div>

        <div class="face right">
            <h2>Menu</h2>
            <p>Idli • Dosa<br>Veg Thali<br>Rice & Dal</p>
        </div>

        <div class="face left">
            <h2>Reviews</h2>
            <p>⭐⭐⭐⭐⭐<br>Best canteen service</p>
        </div>

        <div class="face top">
            <h2>Bulk Orders</h2>
            <p>Daily meals for industries</p>
        </div>

        <div class="face bottom">
            <h2>Contact</h2>
            <p>📞 9XXXXXXXXX<br>Bangalore</p>
        </div>

    </div>
</div>

</body>
</html>
