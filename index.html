<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shubh Nidhi Canteen | Industrial & Corporate Catering</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins, sans-serif;
}

body{
  background:#000 !important;
  color:#fff;
  overflow-x:hidden;
}

/* ✅ Canvas background */
#bg{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-1;
  background:#000; /* ✅ Always black */
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  padding:16px 50px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(18px);
  z-index:999;
}
nav h1{
  color:#ffb703;
  font-size:24px;
}
nav a{
  color:#fff;
  margin-left:22px;
  text-decoration:none;
  font-weight:500;
}
nav a:hover{color:#ffb703}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-top:60px;
  perspective:1500px;
}
.hero-box{
  width:88%;
  padding:70px;
  background:rgba(255,255,255,0.09);
  border-radius:40px;
  box-shadow:0 60px 160px rgba(0,0,0,0.9);
  transform-style:preserve-3d;
  transition:.35s;
}
.hero-box h2{
  font-size:55px;
  color:#ffb703;
  text-shadow:0 0 30px rgba(255,183,3,.6);
}
.hero-box p{
  margin-top:15px;
  font-size:20px;
  color:#ddd;
}
.btns{margin-top:30px; display:flex; flex-wrap:wrap; gap:14px;}
.btn{
  padding:14px 30px;
  border-radius:60px;
  background:#ffb703;
  color:#000;
  font-weight:700;
  text-decoration:none;
  box-shadow:0 0 35px rgba(255,183,3,.8);
  transition:.25s;
}
.btn.alt{
  background:transparent;
  color:#ffb703;
  border:2px solid #ffb703;
}
.btn:hover{transform:scale(1.08);}

/* SECTION */
.section{
  padding:120px 10%;
}
.section h2{
  text-align:center;
  font-size:42px;
  margin-bottom:50px;
  color:#ffb703;
}

/* MENU BLOCKS */
.menu-block{
  margin-bottom:40px;
  padding:25px;
  border-radius:18px;
  background:rgba(255,255,255,0.07);
  box-shadow:0 20px 60px rgba(0,0,0,0.75);
}
.menu-block h3{
  color:#ffb703;
  font-size:24px;
  margin-bottom:15px;
}
.menu-items{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px 25px;
}
.menu-items p{
  padding:8px 10px;
  border-radius:12px;
  background:rgba(0,0,0,0.35);
  border:1px solid rgba(255,255,255,0.08);
}

/* REVIEW */
.review-box{
  max-width:520px;
  margin:20px auto;
  background:rgba(255,255,255,0.08);
  padding:20px;
  border-radius:14px;
  box-shadow:0 10px 40px rgba(0,0,0,0.7);
}
.review-box h2{
  text-align:center;
  margin-bottom:15px;
  color:#ffb703;
}
.review-box input,
.review-box textarea,
.review-box select{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(0,0,0,0.4);
  color:#fff;
  outline:none;
}
.review-box button{
  width:100%;
  padding:10px;
  background:#ffb703;
  color:#000;
  border:none;
  font-size:16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}
.review-box button:hover{
  opacity:0.9;
}

.review-list{
  max-width:520px;
  margin:20px auto;
}
.single-review{
  background:rgba(255,255,255,0.08);
  padding:15px;
  margin-bottom:10px;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,0.5);
}
.stars{color:gold}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:25px;
  right:25px;
  background:#25D366;
  color:#fff;
  padding:14px 20px;
  border-radius:60px;
  font-weight:700;
  text-decoration:none;
  box-shadow:0 0 40px rgba(0,0,0,.9);
  animation:pulse 1.4s infinite;
}
